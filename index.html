<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>The Showroom: My Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f13;--panel:#17191f;--line:#2a2d36;--text:#ecebe6;--dim:#9498a3;--accent:#e9b872;--danger:#ff7b7b;--ease:cubic-bezier(.2,.8,.2,1);--cols:2}
@media(min-width:640px){:root{--cols:3}}
@media(min-width:960px){:root{--cols:4}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:linear-gradient(#15171d,#0b0c0f) fixed;color:var(--text);font:400 16px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:clip;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3,.brand{font-family:'Syne',sans-serif}
header,main{width:min(1100px,100% - 2rem);margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 0;gap:.6rem}
.brand{font-weight:800;font-size:1.1rem}
.actions{display:flex;gap:.5rem}
.pill{font:inherit;font-size:.95rem;color:var(--text);cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.5rem 1rem;transition:transform .3s var(--ease),border-color .3s}
.pill:hover{transform:translateY(-2px);border-color:var(--accent)}
.pill.primary{background:var(--accent);color:#1b1208;border-color:var(--accent);font-weight:500}
.pill.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:clamp(2rem,7vw,3.6rem);font-weight:800;line-height:1.05;letter-spacing:-.02em;padding:1rem 0 .3rem}
.lead{color:var(--dim);margin-bottom:1.2rem}
nav{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 1rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav .pill{white-space:nowrap;flex:none;background:transparent}
nav .pill[aria-selected=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
nav small{opacity:.6;margin-left:.35rem}

/* ---- the shelf ---- */
.shelf{--W:min(100vw - 2rem,1100px);--rowh:calc(var(--W) / var(--cols) * 1.42);position:relative;display:grid;grid-template-columns:repeat(var(--cols),1fr);
grid-auto-rows:var(--rowh);min-height:calc(var(--rowh) * 2);margin-bottom:3rem;border-radius:10px;overflow:hidden;
box-shadow:inset 0 0 50px rgba(0,0,0,.65),0 0 0 6px #2b1f16,0 0 0 8px #120c08}
/* wooden planks drawn under every row */
.shelf.sit{background:
 repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rowh) - 18px),#7a5841 calc(var(--rowh) - 18px),#7a5841 calc(var(--rowh) - 16px),#553b2a calc(var(--rowh) - 16px),#3d2a1d calc(var(--rowh) - 5px),#0f0a06 calc(var(--rowh) - 5px),#0f0a06 var(--rowh)),
 repeating-linear-gradient(90deg,#1b1d24 0,#1b1d24 38px,#181a20 38px,#181a20 76px)}
/* pegboard with a metal rail above every row */
.shelf.hang{background:
 repeating-linear-gradient(to bottom,#c9ced8 0,#c9ced8 2px,#8b919e 2px,#6a7080 8px,#0b0c0f 8px,#0b0c0f 10px,transparent 10px,transparent var(--rowh)),
 radial-gradient(circle,#090a0d 0 2.4px,transparent 3px) 0 0/22px 22px,#2b2f39}
.item{position:relative;display:flex;flex-direction:column;align-items:center;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
-webkit-tap-highlight-color:transparent}
.enter .item{animation:settle .7s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
.sit .item{justify-content:flex-end;padding-bottom:18px}
.hang .item{padding-top:6px;transform-origin:50% 0}
.pic{position:relative;width:76%;aspect-ratio:4/5;overflow:hidden;background:#0f1115;border-radius:8px;transition:transform .4s var(--ease),box-shadow .4s}
.sit .pic{border:3px solid #23262e;box-shadow:0 12px 14px -6px rgba(0,0,0,.7)}
.sit .item:hover .pic,.sit .item:focus-visible .pic{transform:translateY(-8px);box-shadow:0 22px 20px -8px rgba(0,0,0,.75)}
.hang .item::before{content:"";width:12px;height:16px;border-radius:3px 3px 6px 6px;background:linear-gradient(90deg,#8b919e,#e3e6ec,#8b919e);z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.6)}
.hang .pic{margin-top:-6px;border-radius:6px 6px 4px 4px;border:4px solid #efede6;box-shadow:0 14px 16px -6px rgba(0,0,0,.7)}
.hang:not(.arranging) .item:hover,.hang:not(.arranging) .item:focus-visible{animation:swing 1.3s ease-out}
.arranging .item{animation:wiggle .45s ease-in-out infinite alternate}
.arranging .item:nth-child(even){animation-delay:-.2s}
.arranging .item.picked{animation:none;z-index:3}
.arranging .item.picked .pic{outline:3px solid var(--accent);outline-offset:3px;transform:translateY(-10px) scale(1.05)}
@keyframes wiggle{from{transform:rotate(-.9deg)}to{transform:rotate(.9deg)}}
.hint{margin:-.4rem 0 1rem;padding:.6rem .9rem;border:1px dashed var(--accent);border-radius:12px;color:var(--accent);font-size:.92rem}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:1.4rem .5rem .4rem;text-align:center;font:600 .78rem/1.15 'Syne',sans-serif;
background:linear-gradient(transparent,rgba(0,0,0,.82));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
@keyframes settle{from{opacity:0;transform:translateY(-26px)}}
@keyframes swing{15%{transform:rotate(4.5deg)}35%{transform:rotate(-3.5deg)}55%{transform:rotate(2deg)}75%{transform:rotate(-1deg)}}
.empty{grid-column:1/-1;grid-row:1;align-self:center;text-align:center;color:var(--dim);padding:0 1.5rem;pointer-events:none}

/* ---- dialogs ---- */
dialog{border:0;background:transparent;color:var(--text);position:fixed;inset:0;margin:auto;padding:0;width:min(860px,calc(100% - 1.5rem));height:fit-content;
max-height:calc(100vh - 1.5rem);max-height:calc(100dvh - 1.5rem);overflow:visible}
dialog::backdrop{background:rgba(5,6,8,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog[open] .sheet{animation:pop .4s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.sheet{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:1.2rem;max-height:calc(100vh - 1.5rem);max-height:calc(100dvh - 1.5rem);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet.narrow{max-width:520px;margin-inline:auto}
.close{position:sticky;top:0;float:right;z-index:3}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;align-items:center;clear:both}
.big img{width:100%;max-height:70vh;max-height:70dvh;object-fit:contain;background:#0f1115;border-radius:14px;display:block}
.info h2{font-size:clamp(1.4rem,5vw,2.1rem);line-height:1.1;margin-bottom:.4rem}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.tags span{border:1px solid var(--line);border-radius:999px;padding:.1rem .7rem;font-size:.85rem;color:var(--dim)}
.info p{color:#cfcfca;white-space:pre-wrap}
.info .pill{margin-top:1.2rem}
form{display:grid;gap:.8rem;clear:both}
label{display:grid;gap:.3rem;font-size:.9rem;color:var(--dim)}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:#0f1115;border:1px solid var(--line);border-radius:12px;padding:.65rem .8rem;width:100%;-webkit-appearance:none;appearance:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.preview{max-height:130px;margin-inline:auto;border-radius:10px;display:none}
.msg{min-height:1.2em;font-size:.9rem;color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:var(--text);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;opacity:0;transition:.4s var(--ease);z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.setup{display:none;margin:0 0 1.5rem;padding:1rem;border:1px solid var(--danger);border-radius:14px;color:var(--dim)}
@media(max-width:720px){.detail{grid-template-columns:1fr}.row{grid-template-columns:1fr}.big img{max-height:50vh;max-height:50dvh}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <div class="brand">The Showroom</div>
  <div class="actions">
    <button id="arrBtn" class="pill" hidden>Rearrange</button>
    <button id="addBtn" class="pill primary" hidden>Add item</button>
    <button id="authBtn" class="pill">Owner login</button>
  </div>
</header>

<main>
  <h1>My Collection</h1>
  <p class="lead">Tap anything on the shelf to take a closer look.</p>
  <div class="setup" id="setup">Firebase isn't connected yet. Paste your config into <code>firebaseConfig</code> in the script at the bottom of this file.</div>
  <nav id="tabs" role="tablist"></nav>
  <div class="hint" id="hint" hidden></div>
  <div class="shelf" id="shelf"></div>
</main>

<dialog id="viewDlg"><div class="sheet">
  <button class="pill close" data-close>Close</button>
  <div class="detail">
    <div class="big"><img id="vImg" alt=""></div>
    <div class="info">
      <h2 id="vName"></h2>
      <div class="tags" id="vTags"></div>
      <p id="vNote"></p>
      <button class="pill" id="frontBtn" hidden>Move to front</button>
      <button class="pill danger" id="delBtn" hidden>Delete item</button>
    </div>
  </div>
</div></dialog>

<dialog id="addDlg"><div class="sheet narrow">
  <button class="pill close" data-close>Close</button>
  <h2 style="margin-bottom:1rem">Add to the collection</h2>
  <form id="addForm">
    <div class="row">
      <label>Shelf<select id="fCat" required></select></label>
      <label>Name<input id="fName" required maxlength="80"></label>
    </div>
    <div class="row">
      <label>Series or brand<input id="fSeries" maxlength="60"></label>
      <label>Year<input id="fYear" inputmode="numeric" maxlength="4"></label>
    </div>
    <label>Note<textarea id="fNote" rows="3" maxlength="500"></textarea></label>
    <label>Photo<input id="fFile" type="file" accept="image/*" required></label>
    <img class="preview" id="fPrev" alt="Photo preview">
    <div class="msg" id="addMsg"></div>
    <button class="pill primary" id="saveBtn">Save item</button>
  </form>
</div></dialog>

<dialog id="loginDlg"><div class="sheet narrow" style="max-width:400px">
  <button class="pill close" data-close>Close</button>
  <h2 style="margin-bottom:1rem">Owner login</h2>
  <form id="loginForm">
    <label>Email<input id="lEmail" type="email" required autocomplete="username"></label>
    <label>Password<input id="lPass" type="password" required autocomplete="current-password"></label>
    <div class="msg" id="loginMsg"></div>
    <button class="pill primary">Log in</button>
  </form>
</div></dialog>
<div class="toast" id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,query,orderBy,serverTimestamp,updateDoc,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps > Web app)
const firebaseConfig = {
  apiKey: "AIzaSyCvj0I-JUd1AJ7vWKwTzH97HBgnZYR5Cto",
  authDomain: "hotwheels-and-stuff.firebaseapp.com",
  projectId: "hotwheels-and-stuff",
  storageBucket: "hotwheels-and-stuff.firebasestorage.app",
  messagingSenderId: "332582091390",
  appId: "1:332582091390:web:43e4d8fd403c90ab22f62f",
  measurementId: "G-9VD0JVD6TH"
}

const CATS = ["Hot Wheels","LEGO","Action Figures","Die-cast Models"];
const HANGING = ["Hot Wheels"]; // shelves where items hang from a pegboard rail
const $ = id => document.getElementById(id);
let items = [], cat = CATS[0], isOwner = false, current = null, db, auth, arrange = false, picked = null, lastCat = null;

const toast = t => { const e=$('toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const key = it => it.order ?? -(it.createdAt?.toMillis?.() ?? Date.now()); // new items go first until you place them
const sorted = () => items.filter(i => i.category === cat).sort((a, b) => key(a) - key(b));
function render(enter = lastCat !== cat){
  lastCat = cat;
  $('tabs').innerHTML = CATS.map(c => {
    const n = items.filter(i => i.category === c).length;
    return `<button class="pill" role="tab" aria-selected="${c===cat}" data-cat="${esc(c)}">${esc(c)}<small>${n}</small></button>`;
  }).join('');
  const list = sorted();
  const sh = $('shelf');
  sh.className = 'shelf ' + (HANGING.includes(cat) ? 'hang' : 'sit') + (arrange ? ' arranging' : '') + (enter ? ' enter' : '');
  $('hint').hidden = !arrange;
  $('hint').textContent = picked ? 'Now tap the spot where it should go.' : 'Tap a piece to pick it up. The top-left spot is the best seat in the house.';
  sh.innerHTML = list.length ? '' : `<div class="empty">${isOwner ? 'This shelf is empty. Use "Add item" to place your first piece.' : 'This shelf is empty for now. Check back soon.'}</div>`;
  list.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'item'; b.style.setProperty('--i', Math.min(i, 10)); b.setAttribute('aria-label', it.name);
    b.innerHTML = `<div class="pic"><img src="${it.image}" alt="" loading="lazy"><span class="cap">${esc(it.name)}</span></div>`;
    b.classList.toggle('picked', it.id === picked);
    b.onclick = () => arrange ? place(it) : openItem(it);
    sh.appendChild(b);
  });
}
function openItem(it){
  current = it;
  $('vImg').src = it.image; $('vImg').alt = it.name;
  $('vName').textContent = it.name;
  $('vTags').innerHTML = [it.category, it.series, it.year].filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('');
  $('vNote').textContent = it.note || '';
  $('delBtn').hidden = !isOwner; $('frontBtn').hidden = !isOwner;
  $('viewDlg').showModal();
}

async function place(it){
  if(!isOwner) return;
  if(!picked || picked === it.id){ picked = picked === it.id ? null : it.id; return render(false); }
  const list = sorted(), from = list.findIndex(x => x.id === picked), to = list.findIndex(x => x.id === it.id);
  picked = null;
  if(from < 0 || to < 0) return render(false);
  list.splice(to, 0, list.splice(from, 1)[0]);
  try{
    const b = writeBatch(db);
    list.forEach((x, i) => { if(x.order !== i) b.update(doc(db, 'items', x.id), {order: i}); });
    await b.commit();
  }catch{ toast('Could not save the new order. Are you logged in?'); render(false); }
}
$('arrBtn').onclick = () => { arrange = !arrange; picked = null; $('arrBtn').textContent = arrange ? 'Done' : 'Rearrange'; render(false); };
$('tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; cat = b.dataset.cat; picked = null; render(); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if(e.target === d) d.close(); }));
$('fCat').innerHTML = CATS.map(c => `<option>${esc(c)}</option>`).join('');
$('addBtn').onclick = () => { $('fCat').value = cat; $('addDlg').showModal(); };
$('authBtn').onclick = () => isOwner ? signOut(auth) : $('loginDlg').showModal();

// shrink photos so they fit in Firestore (1 MB per document). Safari can't encode WebP, so fall back to JPEG/PNG.
function compress(file, max = 720){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const probe = document.createElement('canvas'); probe.width = probe.height = 1;
      const webp = probe.toDataURL('image/webp').startsWith('data:image/webp');
      const png = file.type === 'image/png';
      let size = max, out = '';
      for(let i = 0; i < 6; i++){
        const s = Math.min(1, size / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
        const g = c.getContext('2d');
        if(!png){ g.fillStyle = '#15171c'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(img, 0, 0, c.width, c.height);
        out = webp ? c.toDataURL('image/webp', .82) : png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .82);
        if(out.length < 800000) break;
        size = Math.round(size * .78);
      }
      res(out);
    };
    img.onerror = () => rej(new Error('Could not read that image.'));
    img.src = url;
  });
}
$('fFile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try { $('fPrev').src = await compress(f, 300); $('fPrev').style.display = 'block'; } catch {}
};

try{
  if(firebaseConfig.apiKey.startsWith('YOUR_')) throw new Error('no config');
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app); db = getFirestore(app);

  onSnapshot(query(collection(db,'items'), orderBy('createdAt','desc')), snap => {
    items = snap.docs.map(d => ({id:d.id, ...d.data()})); render();
  }, err => { toast('Could not load the collection.'); console.error(err); });

  onAuthStateChanged(auth, u => {
    isOwner = !!u;
    $('addBtn').hidden = !isOwner; $('arrBtn').hidden = !isOwner;
    if(!isOwner){ arrange = false; picked = null; $('arrBtn').textContent = 'Rearrange'; }
    $('authBtn').textContent = isOwner ? 'Log out' : 'Owner login';
    render();
  });

  $('loginForm').onsubmit = async e => {
    e.preventDefault(); $('loginMsg').textContent = '';
    try { await signInWithEmailAndPassword(auth, $('lEmail').value, $('lPass').value); $('loginDlg').close(); $('loginForm').reset(); toast('Welcome back'); }
    catch { $('loginMsg').textContent = 'Email or password is wrong. Try again.'; }
  };

  $('addForm').onsubmit = async e => {
    e.preventDefault(); $('addMsg').textContent = ''; $('saveBtn').disabled = true;
    try {
      const image = await compress($('fFile').files[0]);
      await addDoc(collection(db,'items'), {
        category: $('fCat').value, name: $('fName').value.trim(), series: $('fSeries').value.trim(),
        year: $('fYear').value.trim(), note: $('fNote').value.trim(), image, createdAt: serverTimestamp()
      });
      $('addForm').reset(); $('fPrev').style.display = 'none'; $('addDlg').close(); toast('Saved');
    } catch(err){ $('addMsg').textContent = err.message || 'Saving failed. Make sure you are logged in.'; }
    $('saveBtn').disabled = false;
  };

  $('frontBtn').onclick = async () => {
    if(!current) return;
    try{ await updateDoc(doc(db,'items',current.id), {order: key(sorted()[0]) - 1}); $('viewDlg').close(); toast('Moved to the front'); }
    catch{ toast('Could not move it. Are you logged in?'); }
  };
  $('delBtn').onclick = async () => {
    if(!current || !confirm(`Delete "${current.name}"? This can't be undone.`)) return;
    try { await deleteDoc(doc(db,'items',current.id)); $('viewDlg').close(); toast('Deleted'); }
    catch { toast('Delete failed. Are you logged in?'); }
  };
}catch(err){
  $('setup').style.display = 'block'; $('authBtn').disabled = true; render();
}
</script>
</body>
</html>
